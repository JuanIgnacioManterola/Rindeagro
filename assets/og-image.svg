<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4a2e"/>
      <stop offset="55%" stop-color="#2d6e47"/>
      <stop offset="100%" stop-color="#0f6e56"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="rgba(201,168,76,0.28)"/>
      <stop offset="100%" stop-color="rgba(201,168,76,0)"/>
    </radialGradient>
    <pattern id="dots" width="52" height="52" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Estrella + wordmark -->
  <g transform="translate(80,80)">
    <g transform="translate(0,0)">
      <circle cx="34" cy="34" r="34" fill="#c9a84c"/>
      <path d="M34 12 L40.5 26 L56 27.5 L44 38 L48 53 L34 45 L20 53 L24 38 L12 27.5 L27.5 26 Z"
            fill="#1a4a2e"/>
    </g>
    <g transform="translate(90,22)">
      <text x="0" y="28" font-family="'Playfair Display', Georgia, serif"
            font-size="34" font-weight="700" fill="#ffffff">Rinde<tspan fill="#c9a84c">.</tspan>Agro</text>
      <text x="0" y="52" font-family="'DM Sans', system-ui, sans-serif"
            font-size="14" fill="rgba(250,247,240,0.7)"
            letter-spacing="4">PLATAFORMA AGROPECUARIA ARGENTINA</text>
    </g>
  </g>

  <!-- Título hero -->
  <g transform="translate(80,240)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif"
          font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">
      Sabé exactamente
    </text>
    <text x="0" y="100" font-family="'Playfair Display', Georgia, serif"
          font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">
      cuánto <tspan font-style="italic" fill="#c9a84c">rinde</tspan> tu campaña.
    </text>
  </g>

  <!-- Subtítulo -->
  <text x="80" y="480" font-family="'DM Sans', system-ui, sans-serif"
        font-size="24" fill="rgba(250,247,240,0.82)" font-weight="400">
    Rentabilidad, precios de Rosario, análisis de suelo y registro agronómico.
  </text>
  <text x="80" y="514" font-family="'DM Sans', system-ui, sans-serif"
        font-size="24" fill="rgba(250,247,240,0.82)" font-weight="400">
    Todo desde el celular. Cargá datos por WhatsApp desde el campo.
  </text>

  <!-- CTA + URL -->
  <g transform="translate(80,570)">
    <rect x="0" y="0" width="235" height="46" rx="10" fill="#c9a84c"/>
    <text x="117.5" y="30" font-family="'DM Sans', system-ui, sans-serif"
          font-size="16" font-weight="700" fill="#1a4a2e" text-anchor="middle">
      🌱 Empezar 15 días gratis
    </text>
    <text x="255" y="30" font-family="'DM Sans', system-ui, sans-serif"
          font-size="17" fill="rgba(250,247,240,0.7)" font-weight="500">
      rindeagro.app
    </text>
  </g>

  <!-- Marca de agua decorativa -->
  <text x="1120" y="605" font-family="'DM Sans', system-ui, sans-serif"
        font-size="12" fill="rgba(250,247,240,0.4)" text-anchor="end"
        letter-spacing="3">HECHA EN ARGENTINA · 🇦🇷</text>
</svg>
